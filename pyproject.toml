[project]
name = "async-payment-processor"
version = "0.1.0"
description = "Async payment processing microservice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.32.0,<0.33",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.6.0,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30.0,<0.31",
    "alembic>=1.14.0,<1.15",
    "faststream[rabbit,cli]>=0.5.34,<0.6",
    "aio-pika>=9.4.0,<10",
    "aiohttp>=3.11.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<0.25",
    "pytest-xdist>=3.6.0,<4",
    "httpx>=0.28.0,<0.29",
    "ruff>=0.8.0,<0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: unit tests",
    "integration: requires PostgreSQL and/or RabbitMQ",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP038"]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["E501", "I001", "UP035", "UP007"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
